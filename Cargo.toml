[package]
name = "macros"
version = "0.6.1"
edition = "2024"
description = "Macros — an Emacs-style GPUI editor scripted in Steel"
repository = "https://github.com/macros-app/macros"
authors = ["Kyle Gwinnup"]
license = "MIT"

[dependencies]
# Zed's GPU-accelerated UI framework. Pinned to the published crates.io release:
# git `main` split the platform into `gpui_macos`, whose glyph rasterization
# renders nothing in our build (all text invisible while quads render). 0.2.2 is
# the self-contained, text-working version.
gpui = "0.2.2"
# Steel: an embeddable Scheme, used here as the extension ("elisp") language.
# The crate is published as `steel-core` but its library is named `steel`.
steel = { package = "steel-core", version = "0.8.2" }
# Grapheme-aware cursor movement.
unicode-segmentation = "1"
# Embed the `scheme/` Steel runtime into the binary at compile time.
include_dir = "0.7"
# LSP client: JSON-RPC messages and an async channel from the reader thread.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
# Lock-free snapshot publishing: thme editor swaps a fresh snapshot in with one
# atomic store; the Scheme read bridges load it without ever blocking the UI.
arc-swap = "1"
# Rope text storage: O(log n) edits, line indexing, and UTF-16 conversion.
#
# Default features are OFF on purpose: ropey's default `unicode_lines` treats
# U+2028/U+2029/NEL/VT/FF (and `cr_lines` a lone CR) as line breaks, while the
# rest of the editor — tree-sitter rows, overlay line deltas (`matches('\n')`),
# Scheme's line splitting — counts only `\n`. A disagreeing line model put
# cursor arithmetic mid-character (backspace after U+2028 aborted the process).
# With no line feature, a line ends at `\n` (a CRLF pair is `\r` + that `\n`;
# `Buffer` treats the pair as one unit for motion and deletion).
ropey = { version = "1.6", default-features = false, features = ["simd"] }
# Syntax highlighting: tree-sitter + the Scheme grammar (for highlighting Steel).
# We drive tree-sitter directly (not tree-sitter-highlight) for incremental
# reparsing. `streaming-iterator` is needed to iterate QueryCursor matches.
tree-sitter = "0.27"
tree-sitter-scheme = "=0.24.7-1"
streaming-iterator = "0.1"
# Regex engine for evil-mode `/` search and `:%s` substitute.
regex = "1"
# Text diffing for ediff: line-level hunks + inline (word) refinement. Powers
# the `diff-strings` / `diff-inline` primitives behind scheme/ediff.scm.
similar = "3"
# ripgrep, as a library: `ignore` is its gitignore-aware parallel directory
# walker; `grep` is its content searcher. Drives the Scheme-configurable
# `walk-files` / `grep-files` primitives (no external `rg` binary needed).
ignore = "0.4"
grep = "0.4"
# Filesystem watching: powers buffer auto-revert and live dired-sidebar/dired refresh.
# `-mini` coalesces the OS event storm into a debounced batch on its own thread;
# we forward each batch onto the GPUI foreground (see `Editor::on_fs_events`).
# It re-exports `notify` as `notify_debouncer_mini::notify`, so no separate dep.
notify-debouncer-mini = "0.7"
nucleo-matcher = "0.3.1"
tree-sitter-language = "0.1.7"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-lua = "0.5.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = "0.5.3"
tree-sitter-zig = "1.1.2"
tree-sitter-r = "1.3.0"
tree-sitter-ocaml = "0.26.0"
tree-sitter-haskell = "0.24.1"
tree-sitter-scala = "0.26.0"
# Clojure: the `-orchard` fork is the maintained one that publishes both
# `LANGUAGE: LanguageFn` and a `HIGHLIGHTS_QUERY`; the bare `tree-sitter-clojure`
# crate ships only the parser.
tree-sitter-clojure-orchard = "0.2.5"
# SQL: the `-sequel` crate is DerekStride's grammar (the maintained one),
# publishing `LANGUAGE: LanguageFn` and `HIGHLIGHTS_QUERY` on tree-sitter 0.26+.
tree-sitter-sequel = "0.3.11"
# Elixir: the official grammar crate, publishing `LANGUAGE: LanguageFn` and
# `HIGHLIGHTS_QUERY` on tree-sitter 0.26+.
tree-sitter-elixir = "0.3.5"
# LaTeX and Typst grammars. No upstream crate exposes the modern `LanguageFn`
# API against tree-sitter 0.26+, so we use the `codebook-*` forks (from the
# Codebook spellchecker), which publish a `LANGUAGE: LanguageFn` const built on
# `tree-sitter-language ^0.1`. These crates bundle only the parser, not a
# highlights query, so we vendor nvim-treesitter's under `grammars/queries/`.
# Mermaid has no equivalent crate and is vendored from C source — see build.rs.
codebook-tree-sitter-latex = "0.6.1"
codebook-tree-sitter-typst = "0.12.1"
# Terminal emulator core: PTY management, VT/ANSI parser, and the scrollback
# grid extracted from Alacritty. We drive it as a library (it has no renderer of
# its own) for the embedded terminal — see `src/terminal.rs`.
alacritty_terminal = "0.26.0"
# Decode raster images (PNG/JPEG/GIF/…) for Org inline-image display. Same
# version GPUI uses, so `image::Frame` matches what `RenderImage::new` expects.
image = "0.25"
# Unique node IDs for org-roam (`(org-id-new)`) and local-time formatting for
# timestamps / agenda "today" (`(current-time fmt)`). Both already in the tree
# transitively via gpui; promoted to direct deps for the Scheme primitives.
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Self-update (src/update.rs). `ureq` is a small blocking HTTP/1.1 client with
# rustls TLS baked in — no tokio runtime required, so it slots cleanly into
# gpui's background executor for the one-shot manifest fetch + artifact
# download. `semver` compares the manifest version against this build's
# CARGO_PKG_VERSION; `sha2`/`hex` verify the downloaded artifact's digest
# (fetched as a `.sha256` sidecar next to the artifact on R2).
ureq = "3"
semver = "1"
sha2 = "0.10"
hex = "0.4"
# Encoding + OS randomness for the Scheme crypto primitives (`base64url-encode`,
# `hex->base64url`, `random-bytes`) that let a Steel package run an OAuth PKCE
# login flow. `base64` does URL-safe/no-pad; `getrandom` reads the OS CSPRNG.
# Both are already in the tree transitively (via gpui/uuid), so these are direct
# promotions, not new builds.
base64 = "0.22"
getrandom = "0.2"
# Charset decoding for the `decode-charset` Scheme primitive: legacy-encoded
# bytes (hex interchange) → UTF-8 string, by WHATWG label ("windows-1252",
# "iso-8859-1", "shift_jis", …). Already in the tree transitively; a promotion.
# The grid buffer (src/grid/) also uses it to transcode UTF-16 / Windows-1252
# CSV files to UTF-8 on load and back again on save.
encoding_rs = "0.8"
# Grid buffer (src/grid/): SIMD byte search for the CSV record scanner
# (`memchr3` over delimiter + CR + LF). Already in the tree via regex.
memchr = "2"
# Grid buffer string interner: FxHash is fast on the short keys typical of
# spreadsheet cells. Already in the tree transitively.
rustc-hash = "2"
# Grid buffer string interner: `HashTable<u32>` stores only ids and re-hashes
# from the arena on demand, so each distinct cell string is stored once (std's
# HashMap would need the string — a second copy — as its key). Same version is
# already in the tree; no default hasher needed since we bring FxHash.
hashbrown = { version = "0.15", default-features = false }
# Blocking TLS client sockets for the `tls-*` Scheme primitives (IMAP/SMTP
# protocol code in Steel — macros-email-client). Both already in the tree via
# ureq; direct promotions, same major versions.
# default-features off: the default provider is aws-lc-rs, but the rest of the
# tree (ureq) builds rustls with ring — enabling both makes the process-level
# CryptoProvider ambiguous and rustls panics at handshake. Mirror ureq's set.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
# WebSocket protocol for the `ws-*` Scheme primitives. default-features off and
# NO tls feature: we hand tungstenite an already-connected stream (our own
# `Sock`, plain or ring-rustls), so it only frames the protocol — no second TLS
# stack, no crypto-provider clash.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# SQLite for the generic `sqlite-*` Scheme primitives (a local search index in
# macros-email-client; also usable by any package wanting a real database). The
# `bundled` feature compiles SQLite from source — no system libsqlite3 — and
# includes FTS5, the full-text search engine those primitives expose.
rusqlite = { version = "0.40", features = ["bundled"] }
# Cross-platform cache dir (`~/Library/Caches` / `~/.cache` / `%LOCALAPPDATA%`)
# for staging update downloads and compiled user grammars (src/grammar.rs).
dirs = "7"
# Runtime tree-sitter grammars (src/grammar.rs): `dlopen` a user grammar's
# freshly compiled shared library and resolve its `tree_sitter_<lang>` entry
# point. Loading native code is inherent to the feature — see the module's
# safety note. The library is leaked so the resolved `LanguageFn` never dangles.
libloading = "0.9"
# gitoxide: a pure-Rust git implementation, driven as a library for the
# `gix-blame` / `gix-log` / `gix-toplevel` Scheme primitives (see src/script.rs).
# magit historically shells out to `git`; these give magit native blame (which
# porcelain `git status` can't express) and log with no subprocess. Curated
# feature set: `blame` (+ `blob-diff`, which blame's rename detection needs),
# `revision` for the HEAD rev-walk behind `gix-log`, `mailmap` so blame shows
# `.mailmap`-resolved authors like `git blame` does, and `sha1` so gix-hash's
# `Kind` object-id enum is non-empty (without a sha feature the whole crate
# fails to compile). `max-performance-safe` pulls the pure-Rust `zlib-rs`
# inflate — fast, and no system zlib/C toolchain required.
gix = { version = "0.89.0", default-features = false, features = ["blame", "revision", "sha1", "blob-diff", "mailmap", "max-performance-safe"] }

# All unix: `libc::kill` for the process-group kill in `kill-process`. On
# macOS additionally `libc::statfs` to detect a read-only volume (DMG / App
# Translocation) and `renamex_np` for the atomic in-place bundle swap (the
# self-update path).
#
# Capped at 0.2.186 (the last version verified): 0.2.190 drops `libc::ENOATTR`
# on Linux, which `xattr` 0.2.3 (gpui -> gpui_http_client -> zed-async-tar)
# still references, so the Linux build fails. Lift the cap once gpui moves off
# xattr 0.2.
[target.'cfg(unix)'.dependencies]
libc = ">=0.2, <0.2.187"

# macOS-only: NSSpellChecker bindings for the native spellcheck backend
# (src/spell.rs, driving scheme/spell.scm). All three crates are already in
# the tree transitively via gpui, so these add no new compilation units —
# they only surface the AppKit spell-checking API to this crate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSValue", "NSTextCheckingResult", "NSOrthography"] }
objc2-app-kit = { version = "0.3", features = ["NSSpellChecker", "block2"] }
block2 = "0.6"

# Compiles the vendored Mermaid tree-sitter parser (grammars/tree-sitter-mermaid)
# from C at build time. No upstream crate exposes Mermaid against tree-sitter
# 0.26+, so we link `tree_sitter_mermaid()` directly — see build.rs and the
# `LanguageFn` binding in src/highlight.rs.
[build-dependencies]
cc = "1"

# Lint policy. Every `unsafe` block must say why it is sound (`// SAFETY:`),
# and debugging leftovers (`dbg!`, `todo!`) never reach main.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
# gpui + steel are large; a touch of opt keeps the editor responsive while
# still building reasonably fast during development.
opt-level = 1

# Windows-only build dependency: embeds the application icon (and version
# metadata) into macros.exe so the Start-menu / taskbar shortcut shows a real
# icon. The WiX installer (wix/main.wxs) deliberately sets NO Shortcut/@Icon and
# resolves the icon from the exe instead — see build.rs and the shortcut note in
# main.wxs. `winresource` only runs when targeting Windows, so non-Windows
# builds never pull or invoke it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Windows-only runtime dependency: the `cc` crate to locate the host toolchain
# (MSVC cl.exe / MinGW) and its environment, then compile a user grammar to a
# .dll (src/grammar.rs). Unix compiles by spawning cc/c++ directly, but Windows
# toolchain discovery (cl.exe's INCLUDE/LIB env, the registry probe) is fiddly
# enough that we reuse cc's logic — mirroring how Helix builds grammars.
[target.'cfg(windows)'.dependencies]
cc = "1"

# Headless gpui (TestAppContext) for end-to-end editor tests.
[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
# Reference CSV reader for the grid parser's tests: generated inputs go through
# both and the field values are compared. Not a runtime dependency — the grid
# parser needs each field's and each record's exact source byte range (for
# zero-copy Span cells and byte-exact saves), which csv-core's copy-into-an-
# output-buffer API doesn't expose, and csv-core silently skips blank lines.
csv-core = "0.1"

# gpui 0.2.2, vendored with two macOS text-rendering fixes that make glyphs
# crisp on 1x (non-Retina) displays — see vendor/gpui/PATCHES.md.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
# block 0.1.6 (abandoned upstream) with its uninhabited-static future-
# incompatibility fixed — see vendor/block/PATCHES.md.
block = { path = "vendor/block" }
