# cargo-deny configuration — dependency gate.
#
# CI runs `cargo deny check`, which covers four things:
#   [advisories]  RustSec security advisories, yanked and unmaintained crates
#   [licenses]    every crate is MIT-compatible (Macros is MIT, see LICENSE)
#   [bans]        duplicate crate versions (warn only) and wildcard deps
#   [sources]     crates come only from crates.io
#
# Licenses: this enforces that every crate we link is available under a
# license compatible with redistributing Macros under the MIT License.
#
# How the check works: each crate's SPDX expression is evaluated against the
# `allow` list below. For an OR expression (e.g. "Apache-2.0 OR GPL-2.0-only"),
# the crate passes if AT LEAST ONE arm is allowed. Because no GPL/AGPL/LGPL
# identifier is in the allow list, a dual-licensed crate is only accepted via
# its permissive arm — and any crate offered SOLELY under a copyleft license
# that conflicts with MIT will FAIL the build.
#
# To intentionally permit a single crate under a license not listed here, add a
# scoped entry to `exceptions` rather than widening `allow` for everything.

[licenses]
# Reject a license match we are less than this confident about, rather than
# guessing. 0.8 is cargo-deny's default and is plenty for these well-known SPDX
# identifiers.
confidence-threshold = 0.8

# Permissive, MIT-compatible licenses present in the dependency tree.
# NOTE: deliberately ABSENT — GPL-2.0, GPL-3.0, LGPL-*, AGPL-* and any other
# strong copyleft. Their absence is what makes this a real gate: do not add them.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "NCSA",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # MPL-2.0 is FILE-LEVEL (weak) copyleft: it does not conflict with shipping
    # Macros under MIT — MPL §3.3 explicitly permits distributing MPL files
    # inside a larger work under other terms, as long as those files stay MPL.
    # Several deps (bitmaps, im-rc, nucleo-matcher, ...) rely on this.
    "MPL-2.0",
]

# Per-crate license exceptions go here, e.g.:
#   { crate = "some-crate", allow = ["LicenseRef-Foo"] }
exceptions = []

[advisories]
# Fail on any RustSec vulnerability or a yanked crate in Cargo.lock. Every
# entry in `ignore` must say why it does not affect Macros and what would lift
# it, so the list stays auditable.
yanked = "deny"
# Unmaintained notices fail only for crates we depend on directly. The
# transitive ones (async-std, bincode, im-rc, paste, rustybuzz, ttf-parser, …)
# arrive via gpui, steel and ureq and can only be dropped upstream; flagging
# them would make every run red with nothing for us to act on.
unmaintained = "workspace"
ignore = []

[bans]
# gpui, steel, gix and the tree-sitter grammars each pin their own versions of
# common crates, so duplicates are expected and mostly outside our control.
# Warn so they stay visible without blocking CI.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io. A git dependency must be added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
