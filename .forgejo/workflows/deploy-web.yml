name: Deploy Web (Cloudflare)

# Manual-trigger only. Mirrors `release.yml` — a production web deploy is an
# explicit human action, never an on-push side effect. The site under `web/`
# is a fully static Next.js export (output: "export"); there is no Worker
# runtime, no database, and no server secrets to push — just build `out/` and
# upload it to Cloudflare as static assets with Wrangler.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version to show on the downloads page (e.g. 1.2.3). Leave blank to use Cargo.toml."
        required: false
        default: ""
        type: string
      dry_run:
        description: "If true, build the site but run `wrangler deploy --dry-run` instead of deploying."
        required: false
        default: false
        type: boolean

# One web deploy at a time.
concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: build + wrangler deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          # Clone with the token, but don't leave it in .git/config where a
          # dependency's build script could read it.
          persist-credentials: false

      - name: Verify Cloudflare secrets are set
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi

      - name: Verify version input matches Cargo.toml
        # Only when a version is supplied; blank falls back to Cargo.toml so no
        # check is needed. Mirrors the guard in release.yml so the downloads
        # page can never advertise a version that isn't actually released.
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual=$(awk '
            /^\[/ { sect = ($0 ~ /^\[package\]/) ? "p" : ""; next }
            sect == "p" && /^version *= *"/ {
              gsub(/^[^"]*"|"[^"]*$/, ""); print; exit
            }
          ' Cargo.toml)
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::version input is '$VERSION' but Cargo.toml [package].version is '$actual'"
            echo "Pass the matching version, or leave the input blank to use Cargo.toml."
            exit 1
          fi
          echo "version input matches Cargo.toml: $VERSION"

      - name: Install Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: web
        # APP_VERSION overrides the Cargo.toml-derived version that
        # next.config.ts inlines into NEXT_PUBLIC_APP_VERSION. Blank => fall
        # back to Cargo.toml. `next build` (output: "export") emits `web/out`.
        env:
          APP_VERSION: ${{ inputs.version }}
        run: bun run build

      - name: Deploy (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: web
        run: bunx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        if: ${{ !inputs.dry_run }}
        working-directory: web
        run: bunx wrangler deploy
